<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>
TrelloPowerUp.initialize({

  // Shows Project information when the card is opened
  'card-back-section': function(t, options) {
    return {
      title: 'Project information',
      icon: 'https://kvizbaras.github.io/trello-project-fields/icon.svg',
      content: {
        type: 'iframe',
        url: t.signUrl(
          'https://kvizbaras.github.io/trello-project-fields/card.html'
        ),
        height: 180
      }
    };
  },

  // Shows information on the front of the card
  'card-badges': function(t, options) {
    return t.get('card', 'shared', 'pluginData')
      .then(function(data) {

        var pluginData = data.pluginData || [];

        // Find data belonging to our Power-Up
        var ourData = pluginData.find(function(item) {
          return item.idPlugin === '6a845a62d111ed74a35299a2';
        });

        if (!ourData || !ourData.value) {
          return [];
        }

        try {
          var parsed = JSON.parse(ourData.value);
          var fields = parsed.projectFields || {};

          if (!fields.orderNumber) {
            return [];
          }

          return [
            {
              text: 'Užsakymas: ' + fields.orderNumber,
              color: null
            }
          ];

        } catch (error) {
          return [];
        }
      });
  }

});
</script>

</body>
</html>
