<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>
TrelloPowerUp.initialize({

  // Card back
  'card-back-section': function(t, options) {
    return {
      title: 'Project information',
      icon: 'https://kvizbaras.github.io/trello-project-fields/icon.svg',
      content: {
        type: 'iframe',
        url: t.signUrl(
          'https://kvizbaras.github.io/trello-project-fields/card.html'
        ),
        height: 180
      }
    };
  },

  // Card front badge
  'card-badges': function(t, options) {

    return t.get(
      'card',
      'shared',
      'projectFields'
    ).then(function(data) {

      if (!data || !data.orderNumber) {
        return [];
      }

      return [
        {
          text: 'Užsakymas: ' + data.orderNumber
        }
      ];

    });
  }

});
</script>

</body>
</html>
