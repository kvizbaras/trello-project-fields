<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>
window.TrelloPowerUp.initialize({
  'card-back-section': function(t, options) {
    return {
      title: 'Project information',
      icon: 'https://kvizbaras.github.io/trello-project-fields/icon.svg',
      content: {
        type: 'iframe',
        url: t.signUrl(

        height: 180
      }
    };
  }
});
</script>

</body>
<h2>Project Fields Power-Up is working</h2>
</html>
